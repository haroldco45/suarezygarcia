<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suarez & Garcia | Contadora Pública</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #25d366; 
            --text-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo { max-width: 160px; margin-bottom: 15px; }
        h1 { color: #4a148c; font-size: 1.6rem; margin-bottom: 5px; }
        .subtitle { margin-bottom: 25px; font-size: 0.9rem; color: #666; font-weight: 400; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #4a148c;
            display: block;
            margin-bottom: 5px;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: white;
        }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '↑↓';
            font-size: 0.8rem;
            color: #764ba2;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-weight: bold;
        }
        select { appearance: none; cursor: pointer; }

        .btn-whatsapp {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-whatsapp:hover { background-color: #1ebe57; transform: translateY(-2px); }

        .btn-pdf {
            display: inline-block;
            margin-top: 20px;
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        footer {
            margin-top: 30px;
            color: white;
            font-size: 0.8rem;
            text-align: center;
        }

        #sub-check { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <img src="mish.png" alt="Logo Suarez & Garcia" class="logo">
        
        <h1>CAUCASIA</h1>
        <p class="subtitle">Servicios Contables Profesionales</p>

        <div class="input-group">
            <label>¿Qué servicio necesita?</label>
            <div class="select-wrapper">
                <select id="servicio">
                    <option value="No especificado">-- Seleccione aquí ↑↓ --</option>
                    <option value="Declaración de Renta">Declaración de Renta</option>
                    <option value="Asesoría Tributaria">Asesoría Tributaria</option>
                    <option value="Contabilidad General">Contabilidad General</option>
                    <option value="Auditoría Interna">Auditoría Interna</option>
                    <option value="Estados Financieros">Estados Financieros</option>
                    <option value="Trámites DIAN / RUT">Trámites DIAN / RUT</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Nombre Completo</label>
            <input type="text" id="nombre" placeholder="Nombre del interesado">
        </div>

        <div class="input-group">
            <label>Dirección</label>
            <input type="text" id="direccion" placeholder="Barrio / Ciudad">
        </div>

        <div class="input-group">
            <label>Número de Celular</label>
            <input type="tel" id="celular" placeholder="Ej: 3117700111">
        </div>

        <div class="input-group">
            <label>Observaciones</label>
            <textarea id="observaciones" rows="2" placeholder="Detalles adicionales..."></textarea>
        </div>

        <input type="checkbox" id="sub-check" checked>

        <button class="btn-whatsapp" onclick="enviarWhatsApp()">
            Enviar Datos Completos
        </button>

        <a href="suarez.pdf" target="_blank" class="btn-pdf">📄 Ver Catálogo (PDF)</a>
    </div>

    <footer>
        <p>App desarrollada por <strong>Vibras Positivas</strong> © 2026</p>
        <p>Derechos Reservados</p>
    </footer>

    <script>
        let userLocation = "Ubicación no proporcionada";

        // Captura de geolocalización corregida
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                // Enlace funcional para abrir en Google Maps
                userLocation = `https://www.google.com/maps?q=${lat},${lon}`;
            }, (error) => {
                userLocation = "El usuario denegó el acceso al GPS";
            });
        }

        function enviarWhatsApp() {
            const servicio = document.getElementById('servicio').value;
            const nombre = document.getElementById('nombre').value;
            const direccion = document.getElementById('direccion').value;
            const celular = document.getElementById('celular').value;
            const observaciones = document.getElementById('observaciones').value;
            const suscrito = document.getElementById('sub-check').checked ? "ACTIVA" : "INACTIVA";

            if (nombre.trim() === "" || celular.trim() === "") {
                alert("Por favor, ingresa tu nombre y celular para contactarte.");
                return;
            }

            // Mensaje formateado para que llegue toda la información clara
            const mensaje = 
                `*SOLICITUD DE SERVICIO CONTABLE*%0A` +
                `*Suarez %26 Garcia - Caucasia*%0A%0A` +
                `📌 *Servicio Requerido:* ${servicio}%0A` +
                `👤 *Cliente:* ${nombre}%0A` +
                `📍 *Dirección:* ${direccion}%0A` +
                `📱 *Celular:* ${celular}%0A` +
                `💬 *Observaciones:* ${observaciones}%0A` +
                `✅ *Suscripción:* ${suscrito}%0A%0A` +
                `🌍 *Mapa de ubicación:*%0A${userLocation}`;

            const phone = "573117700111";
            const url = `https://api.whatsapp.com/send?phone=${phone}&text=${mensaje}`;
            
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
